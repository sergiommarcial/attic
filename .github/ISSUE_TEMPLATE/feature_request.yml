name: Feature request
description: Suggest something attic could do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        attic only ever moves things to the Trash after a confirmation, and
        makes no network requests. Ideas that change either need a strong case.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like attic to do
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
